name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit tests: CSV parsing, column detection, stats and the copy checker.
      # The live Gemini tests are skipped here (they only run with LIVE=1).
      - run: npm test
      - run: npx nuxi typecheck
      - run: npm run build
